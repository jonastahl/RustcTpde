cargo-features = ["profile-rustflags"]

[package]
name = "rustc_codegen_tpde"
version = "0.1.0"
edition = "2024"

[features]
no-cache = []

[lib]
crate-type = ["dylib"]

[dependencies]
cxx = "^1.0.197"

[dev-dependencies]
libtest-mimic = "0.7"
pretty_assertions = "1.4"
similar = "3.1.1"

[build-dependencies]
cxx-build = "^1.0.197"
cmake = "0.1.58"

[[test]]
name = "runner"
harness = false

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
rustflags = ["-Cforce-frame-pointers=yes"]
